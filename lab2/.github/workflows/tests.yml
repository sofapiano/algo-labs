name: Tests

on:
  push:

jobs:
  c-tests:
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Knapsack
            test_src: knapsack/tests.c
            impl_src: knapsack/knapsack.c
            bin_name: knapsack_tests
          - title: Huffman
            test_src: huffman/tests.c
            impl_src: huffman/huffman.c
            bin_name: huffman_tests
          - title: Activity
            test_src: activity/tests.c
            impl_src: activity/activity.c
            bin_name: activity_tests
    steps:
      - uses: actions/checkout@v4
      - name: Build tests
        run: |
          gcc -std=c11 -Wall -Wextra -pedantic \
            -o /tmp/${{ matrix.bin_name }} \
            ${{ matrix.test_src }} \
            ${{ matrix.impl_src }} \
            -lm
      - name: Run tests
        run: /tmp/${{ matrix.bin_name }}
